# Continuous integration: every push and pull request is built and tested.
# A red build blocks the merge (branch protection), so main is always releasable.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # lets the test reporter publish results on the PR

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}

      - name: Restore
        run: dotnet restore CarRental.sln

      - name: Build
        run: dotnet build CarRental.sln --configuration Release --no-restore

      - name: Unit + architecture tests (fast, no Docker)
        run: >
          dotnet test CarRental.sln --configuration Release --no-build
          --filter "FullyQualifiedName!~CarRental.IntegrationTests"
          --logger "trx;LogFilePrefix=unit" --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Integration tests (SQL Server in Docker via Testcontainers)
        run: >
          dotnet test tests/CarRental.IntegrationTests/CarRental.IntegrationTests.csproj --configuration Release --no-build
          --logger "trx;LogFilePrefix=integration" --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  client:
    name: Build (React client)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
