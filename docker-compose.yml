# Local infrastructure for development: SQL Server (write model) + MongoDB (optional read model).
#   docker compose up -d
# The password below is for LOCAL DEVELOPMENT ONLY and matches appsettings.Development.json.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: carrental-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Only_123!"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Local_Dev_Only_123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: carrental-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  sqldata:
  mongodata:
